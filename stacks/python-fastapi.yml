id: python-fastapi
name: Python FastAPI
description: FastAPI ASGI application
category: python
requires: []
image: "python:{version}-slim"
versions: ["3.10", "3.11", "3.12", "3.13"]
default_version: "3.12"
container_port: 8000
workdir: /app
volume_mount: /app
command: ["sh", "-c", "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"]
env:
  PORT: "8000"
starter_files:
  - path: requirements.txt
    content: |
      fastapi==0.115.6
      uvicorn[standard]==0.34.0
  - path: main.py
    content: |
      from fastapi import FastAPI
      app = FastAPI()
      @app.get("/")
      def home():
          return {"message": "FastAPI site ready"}
