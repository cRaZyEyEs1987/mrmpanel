# Static download mirror for mrmpanel ONLY — do not reuse for other apps.
# Subdomain: mrmpanel.hostingandstuff.online

server {
    server_name mrmpanel.hostingandstuff.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Temporary HTTP until certbot adds SSL (or after DNS is live)
    root /var/www/mrmpanel-dist;
    index index.html;

    location = /install.sh {
        default_type text/plain;
        charset utf-8;
        try_files /install.sh =404;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition 'inline; filename="install.sh"';
    }

    location ^~ /releases/ {
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mrmpanel.hostingandstuff.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mrmpanel.hostingandstuff.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = mrmpanel.hostingandstuff.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mrmpanel.hostingandstuff.online;
    return 404; # managed by Certbot


}