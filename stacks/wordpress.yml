id: wordpress
name: WordPress
description: WordPress CMS (auto DB + one-click admin setup)
category: php
requires: [mariadb]
preferred_db: mariadb
image: "wordpress:{app}-php{version}-apache"
versions: ["8.2", "8.3", "8.4"]
default_version: "8.3"
app_version_label: "WordPress version"
default_app_version: "7.0"
app_versions:
  - id: "7.0"
    php: ["8.2", "8.3", "8.4"]
  - id: "6.9"
    php: ["8.2", "8.3", "8.4"]
  - id: "6.8"
    php: ["8.2", "8.3", "8.4"]
container_port: 80
workdir: /var/www/html
volume_mount: /var/www/html
env: {}
db_env:
  WORDPRESS_DB_HOST: "{host}:{port}"
  WORDPRESS_DB_NAME: "{db_name}"
  WORDPRESS_DB_USER: "{db_user}"
  WORDPRESS_DB_PASSWORD: "{db_password}"
# Panel shows admin user/password fields; install runs via wordpress:cli after deploy
auto_install: wordpress
starter_files: []
