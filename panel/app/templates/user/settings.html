{% extends "base.html" %}
{% block title %}Account — {{ title }}{% endblock %}
{% block content %}
<header class="page-head">
  <h1>Account settings</h1>
  <p class="muted">Only your own profile and panel password.</p>
</header>
{% if error %}<p class="alert error">{{ error }}</p>{% endif %}
{% if ok %}<p class="alert ok">{{ ok }}</p>{% endif %}

<section class="card-form">
  <form method="post" action="/u/settings" class="grid-form">
    <label>Username<input value="{{ meta.username }}" disabled></label>
    <label>Display name<input name="display_name" value="{{ meta.display_name or '' }}"></label>
    <label>New password<input type="password" name="password" autocomplete="new-password" placeholder="leave blank to keep"></label>
    <label>Confirm password<input type="password" name="password2" autocomplete="new-password"></label>
    <button type="submit">Save</button>
  </form>
</section>
<p class="muted">Home: <code>{{ meta.home }}</code></p>
{% endblock %}
